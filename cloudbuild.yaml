steps:
  # 1. Build Docker image y pushear a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/retarget-mcp/retarget-mcp:${SHORT_SHA}'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/retarget-mcp/retarget-mcp:latest'
      - '.'
    id: 'build-image'

  # 2. Push a Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/retarget-mcp/retarget-mcp:${SHORT_SHA}'
    id: 'push-image'

  # 3. Deploy a Cloud Run
  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'retarget-mcp'
      - '--image=us-central1-docker.pkg.dev/$PROJECT_ID/retarget-mcp/retarget-mcp:${SHORT_SHA}'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=3600'
      - '--max-instances=100'
      - '--set-env-vars=GOOGLE_APPLICATION_CREDENTIALS=/var/secrets/cloud.google.com/service_account/key.json,RAILS_ENV=production'
    id: 'deploy-cloud-run'

images:
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/retarget-mcp/retarget-mcp:${SHORT_SHA}'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/retarget-mcp/retarget-mcp:latest'

options:
  machineType: 'N1_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

timeout: '1800s'

tags:
  - 'retarget-mcp'
  - '${SHORT_SHA}'
  - 'latest'
