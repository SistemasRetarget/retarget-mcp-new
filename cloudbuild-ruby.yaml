steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/retarget-mcp:latest'
      - '-f'
      - 'Dockerfile'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/retarget-mcp:latest'

  - name: 'gcr.io/cloud-builders/run'
    args:
      - 'deploy'
      - 'retarget-mcp'
      - '--image=gcr.io/$PROJECT_ID/retarget-mcp:latest'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--memory=2Gi'
      - '--cpu=2'
      - '--port=8080'

images:
  - 'gcr.io/$PROJECT_ID/retarget-mcp:latest'

options:
  machineType: 'N1_HIGHCPU_8'

timeout: '3600s'
